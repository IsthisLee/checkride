<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" role="img" aria-label="게이트가 이 에이전트를 실제로 막은 사례: R0은 확인 없는 답을, R1은 파일 상태 단정을, R2b는 로컬 상태 추측을, R3은 안 돌린 테스트의 통과 주장을 막았다" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <title>did-you-check: 게이트가 이 에이전트를 실제로 막은 사례</title>

  <!-- table body -->
  <rect x="8" y="8" width="744" height="260" rx="8" fill="#0d1117"/>
  <!-- header band -->
  <rect x="8" y="8" width="744" height="36" rx="8" fill="#161b22"/>
  <rect x="8" y="28" width="744" height="16" fill="#161b22"/>

  <!-- column separators -->
  <line x1="78"  y1="8" x2="78"  y2="268" stroke="#21262d" stroke-width="1"/>
  <line x1="322" y1="8" x2="322" y2="268" stroke="#21262d" stroke-width="1"/>
  <line x1="545" y1="8" x2="545" y2="268" stroke="#21262d" stroke-width="1"/>
  <!-- row separators -->
  <line x1="8" y1="44"  x2="752" y2="44"  stroke="#21262d" stroke-width="1"/>
  <line x1="8" y1="100" x2="752" y2="100" stroke="#21262d" stroke-width="1"/>
  <line x1="8" y1="156" x2="752" y2="156" stroke="#21262d" stroke-width="1"/>
  <line x1="8" y1="212" x2="752" y2="212" stroke="#21262d" stroke-width="1"/>
  <!-- outer border -->
  <rect x="8" y="8" width="744" height="260" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- header row -->
  <text x="43"  y="30" fill="#c9d1d9" text-anchor="middle">시점</text>
  <text x="90"  y="30" fill="#c9d1d9">에이전트가 하려던 것</text>
  <text x="334" y="30" fill="#c9d1d9">게이트가 막은 것</text>
  <text x="557" y="30" fill="#c9d1d9">결과</text>

  <!-- row R0 -->
  <text x="43"  y="76" fill="#ff7b72" text-anchor="middle">R0</text>
  <text x="90"  y="68" fill="#c9d1d9">"테스트 있어?"에</text>
  <text x="90"  y="88" fill="#c9d1d9">도구 없이 답하려 함</text>
  <text x="334" y="68" fill="#ff7b72">"지금 Read/Grep/Glob/</text>
  <text x="334" y="88" fill="#ff7b72">Bash로 확인하라"</text>
  <text x="557" y="76" fill="#7ee787">직접 찾아본 뒤 답함</text>

  <!-- row R1 -->
  <text x="43"  y="132" fill="#ff7b72" text-anchor="middle">R1</text>
  <text x="90"  y="132" fill="#c9d1d9">파일 상태를 안 보고 단정하려 함</text>
  <text x="334" y="132" fill="#ff7b72">"지금 실제로 확인하라"</text>
  <text x="557" y="124" fill="#7ee787">실제 파일시스템 확인 →</text>
  <text x="557" y="144" fill="#7ee787">중복 구조를 정확히 파악</text>

  <!-- row R2b -->
  <text x="43"  y="188" fill="#ff7b72" text-anchor="middle">R2b</text>
  <text x="90"  y="180" fill="#c9d1d9">"~처럼 보이지만"으로</text>
  <text x="90"  y="200" fill="#c9d1d9">README 내용을 추측</text>
  <text x="334" y="188" fill="#ff7b72">"실측해서 단정하라"</text>
  <text x="557" y="180" fill="#7ee787">README 원문을 읽고</text>
  <text x="557" y="200" fill="#7ee787">틀린 주장을 바로잡음</text>

  <!-- row R3 -->
  <text x="43"  y="244" fill="#ff7b72" text-anchor="middle">R3</text>
  <text x="90"  y="236" fill="#c9d1d9">테스트를 안 돌리고</text>
  <text x="90"  y="256" fill="#c9d1d9">"통과했다"고 주장</text>
  <text x="334" y="236" fill="#ff7b72">"실제로 실행하고</text>
  <text x="334" y="256" fill="#ff7b72">그 출력을 근거로"</text>
  <text x="557" y="236" fill="#7ee787">테스트를 실제로 돌려</text>
  <text x="557" y="256" fill="#7ee787">출력을 붙여 답함</text>
</svg>
