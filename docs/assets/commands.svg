<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-label="커맨드가 탐색부터 PR까지 절차를 끌고 가는 화면" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <title>checkride: 커맨드가 절차를 끌고 간다</title>

  <rect width="760" height="452" rx="10" fill="#0d1117"/>
  <rect width="760" height="30" rx="10" fill="#161b22"/>
  <rect y="20" width="760" height="10" fill="#161b22"/>
  <circle cx="18" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="15" r="5" fill="#27c93f"/>
  <text x="380" y="19" font-size="11" fill="#8b949e" text-anchor="middle">claude — checkride</text>

  <text x="20" y="58" fill="#79c0ff">&gt; /checkride:full-cycle 로그인 실패 시 재시도를 더한다</text>

  <text x="20" y="90"  fill="#8b949e">Claude</text>
  <text x="20" y="110" fill="#c9d1d9">크기를 재 보니 한 문장으로 줄일 수 없다. 다섯 단계를 밟는다.</text>

  <text x="20"  y="142" fill="#3fb950">1 탐색</text>
  <text x="110" y="142" fill="#8b949e">내장 Explore 서브에이전트에 넘긴다</text>

  <text x="20"  y="168" fill="#3fb950">2 계획</text>
  <text x="110" y="168" fill="#8b949e">plan mode. 승인 전에는 코드를 바꾸지 않는다</text>

  <text x="20"  y="194" fill="#3fb950">3 구현</text>
  <text x="110" y="194" fill="#8b949e">/checkride:tdd — 실패 테스트 먼저, RED 확인, 최소 구현</text>

  <text x="20"  y="220" fill="#3fb950">4 검토</text>
  <text x="110" y="220" fill="#8b949e">내장 /code-review 를 부른다</text>
  <text x="110" y="240" fill="#d29922">정확성에 영향을 주는 지적 2건 → 3 으로 돌아간다</text>

  <text x="20"  y="272" fill="#3fb950">3 구현</text>
  <text x="110" y="272" fill="#8b949e">고친다</text>

  <text x="20"  y="298" fill="#3fb950">4 검토</text>
  <text x="110" y="298" fill="#8b949e">다시 부른다. 남은 지적 없음</text>
  <text x="110" y="318" fill="#8b949e">돌아가는 것은 두 번까지. 더 남으면 멈추고 보고한다</text>

  <text x="20"  y="350" fill="#3fb950">5 마무리</text>
  <text x="110" y="350" fill="#8b949e">/checkride:finish — 검사·린트·커밋·푸시·PR</text>

  <rect x="20" y="374" width="720" height="58" rx="6" fill="#161b22"/>
  <text x="36" y="396" fill="#8b949e">그동안 게이트 네 개는 저절로 돌고 있다. 커맨드를 쓰지 않아도 마찬가지다.</text>
  <text x="36" y="418" fill="#8b949e">근거 없이 단정하면 막고, 검사가 깨진 채로는 커밋하지 못하게 한다.</text>
</svg>
