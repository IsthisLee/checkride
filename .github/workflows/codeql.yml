name: CodeQL

# CodeQL 이 이 저장소에서 보는 것은 둘이다. 셸(bash)은 CodeQL 대상 언어가 아니다.
#   - python  : judge.py·fuzz-inputs.py·lint-expand.py
#   - actions : .github/workflows/*.yml 과 액션 메타데이터 YAML.
#               고정되지 않은 액션, 과한 토큰 권한, 스크립트 인젝션을 본다.
# 언어 식별자는 CodeQL 공식 문서의 Supported languages 표를 따른다(확인일 2026-09-18).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      # 한 언어가 실패해도 나머지 분석 결과는 올라가야 한다.
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: ${{ matrix.language }}

      # python 도 actions 도 빌드 단계가 필요 없다(autobuild 생략).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
